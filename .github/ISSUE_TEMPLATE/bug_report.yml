# .github/ISSUE_TEMPLATE/bug_report.yml
name: Bug Report
description: Report a technical defect
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes: { label: "Description", description: "Clear and concise description of the bug." }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: "Logs & Telemetry", description: "Paste SIEM logs or stack traces (sanitize secrets)." }
