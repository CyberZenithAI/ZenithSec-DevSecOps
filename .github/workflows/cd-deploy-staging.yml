# .github/workflows/cd-release-package.yml
name: ZenithSec CD - Release & Package Validation
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate-and-package:
    name: Validate Scripts & Create Release Package
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PowerShell Environment
        shell: pwsh
        run: |
          Write-Host "=== [ZenithSec] Initializing PowerShell Validation Environment ===" -ForegroundColor Cyan
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
          Install-Module -Name Pester -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          Write-Host "✅ Modules installed successfully" -ForegroundColor Green

      - name: Validate PowerShell Syntax (All Scripts)
        shell: pwsh
        run: |
          Write-Host "=== [ZenithSec] Validating PowerShell Syntax ===" -ForegroundColor Cyan
          $scripts = Get-ChildItem -Path ./src/powershell -Recurse -Include *.ps1,*.psm1
          $errors = @()
          
          foreach ($script in $scripts) {
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$parseErrors)
              if ($parseErrors) {
                  $errors += "SYNTAX ERROR in $($script.Name): $($parseErrors.Message -join '; ')"
              }
          }
          
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              throw "PowerShell syntax validation failed. Check errors above."
          }
          Write-Host "✅ All PowerShell scripts have valid syntax" -ForegroundColor Green

      - name: Run PSScriptAnalyzer (Security Baseline)
        shell: pwsh
        run: |
          Write-Host "=== [ZenithSec] Running PSScriptAnalyzer Security Scan ===" -ForegroundColor Cyan
          $results = Invoke-ScriptAnalyzer -Path ./src/powershell -Settings ./security/PSScriptAnalyzerSettings.psd1 -Recurse -Severity Error
          
          if ($results) {
              $results | Format-Table -AutoSize
              throw "PSScriptAnalyzer detected security violations. Fix errors before release."
          }
          Write-Host "✅ PSScriptAnalyzer passed. No security violations found." -ForegroundColor Green

      - name: Execute Pester Tests (Unit & Integration)
        shell: pwsh
        run: |
          Write-Host "=== [ZenithSec] Running Pester Test Suite ===" -ForegroundColor Cyan
          $config = New-PesterConfiguration
          $config.Run.Path = "./tests"
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = "NUnitXml"
          $config.TestResult.OutputPath = "test-results.xml"
          
          $result = Invoke-Pester -Configuration $config
          
          if ($result.FailedCount -gt 0) {
              throw "Pester tests failed: $($result.FailedCount) failures detected."
          }
          Write-Host "✅ All Pester tests passed successfully" -ForegroundColor Green

      - name: Generate Software Bill of Materials (SBOM)
        shell: pwsh
        run: |
          Write-Host "=== [ZenithSec] Generating SBOM ===" -ForegroundColor Cyan
          $sbom = Get-Content ./security/sbom.json | ConvertFrom-Json
          $sbom.metadata.timestamp = (Get-Date).ToUniversalTime().ToString("o")
          $sbom.metadata.tools = @(@{name="ZenithSec-Release-Pipeline"; version="2026.1.0"})
          $sbom | ConvertTo-Json -Depth 10 | Set-Content ./security/sbom.json
          Write-Host "✅ SBOM updated with release metadata" -ForegroundColor Green

      - name: Create Release Package (ZIP)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Write-Host "=== [ZenithSec] Creating Release Package ===" -ForegroundColor Cyan
          $releaseDir = "release-package"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          
          # Copiar scripts principales
          Copy-Item -Path ./src/powershell -Destination "$releaseDir/scripts" -Recurse
          Copy-Item -Path ./compliance -Destination "$releaseDir/compliance" -Recurse
          Copy-Item -Path ./security -Destination "$releaseDir/security" -Recurse
          
          # Crear archivo ZIP
          $version = $env:GITHUB_REF_NAME
          $zipName = "ZenithSec-AD-Automation-$version.zip"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zipName -Force
          
          Write-Host "✅ Release package created: $zipName" -ForegroundColor Green
          echo "RELEASE_PACKAGE=$zipName" >> $env:GITHUB_ENV

      - name: Upload Release Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: zenithsec-release-${{ github.ref_name }}
          path: ${{ env.RELEASE_PACKAGE }}
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.RELEASE_PACKAGE }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Deployment Summary to SIEM
        shell: pwsh
        run: |
          Write-Host "=== [ZenithSec] Sending Deployment Summary to SIEM ===" -ForegroundColor Cyan
          $payload = @{
              timestamp = (Get-Date).ToUniversalTime().ToString("o")
              source = "ZenithSec-GitHub-Actions"
              event = "RELEASE_PACKAGE_CREATED"
              status = "SUCCESS"
              version = $env:GITHUB_REF_NAME
              commit = $env:GITHUB_SHA
              actor = $env:GITHUB_ACTOR
              repository = $env:GITHUB_REPOSITORY
          } | ConvertTo-Json -Depth 5
          
          $webhook = $env:ZENITHSEC_SIEM_WEBHOOK
          if ($webhook) {
              try {
                  Invoke-RestMethod -Uri $webhook -Method Post -Body $payload -ContentType "application/json" -TimeoutSec 10
                  Write-Host "✅ SIEM notified successfully" -ForegroundColor Green
              } catch {
                  Write-Warning "Failed to notify SIEM: $($_.Exception.Message)"
              }
          } else {
              Write-Host "⚠️ SIEM webhook not configured. Skipping notification." -ForegroundColor Yellow
          }
        env:
          ZENITHSEC_SIEM_WEBHOOK: ${{ secrets.ZENITHSEC_SIEM_WEBHOOK }}
