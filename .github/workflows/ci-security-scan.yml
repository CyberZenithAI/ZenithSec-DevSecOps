name: ZenithSec CI - Security & Secrets Scan
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG_FILE: security/gitleaks-config.json

  psscriptanalyzer:
    name: PowerShell Security Analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
      - name: Run Analyzer (Errors Only)
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./src/powershell -Settings ./security/PSScriptAnalyzerSettings.psd1 -Recurse -Severity Error
          if ($results) {
            $results | Format-List
            exit 1
          }
          Write-Host "PowerShell security scan PASSED"

  syntax-validation:
    name: PowerShell Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path ./src/powershell -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "SYNTAX ERROR in $($_.Name)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host "  Line $($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "All scripts have valid syntax"
