name: "🕐 Scheduled Vulnerability Scan"

on:
  schedule:
    - cron: '0 3 * * 1'  # Cada lunes 3:00 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  full-repo-scan:
    name: "🔍 Full Repository Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy fs scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: cyclonedx-json
          output-file: security/sbom.json

      - name: Commit updated SBOM
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add security/sbom.json
          git diff --quiet --exit-code || git commit -m "chore: update SBOM [automated]"
          git push
