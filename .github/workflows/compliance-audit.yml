# .github/workflows/compliance-audit.yml
name: ZenithSec Compliance - ISO & NIST Audit
on: [push]
permissions: read-all
jobs:
  compliance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compliance Mapping
        shell: pwsh
        run: |
          $complianceFiles = Get-ChildItem -Path ./compliance -Recurse -Filter *.json
          foreach ($file in $complianceFiles) {
              $json = Get-Content $file.FullName | ConvertFrom-Json
              if (-not $json.controls) { throw "Invalid compliance structure in $($file.Name)" }
          }
          Write-Host "Compliance matrices validated successfully."
