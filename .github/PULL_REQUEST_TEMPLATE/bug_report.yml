name: 🐛 Bug Report
description: Report a technical defect or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Telemetry
      description: Paste SIEM logs, Pester output, or stack traces (sanitize secrets first).
      render: shell
