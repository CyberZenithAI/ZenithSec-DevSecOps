# .github/PULL_REQUEST_TEMPLATE/pull_request_template.yml
name: Pull Request
description: Standard PR template
body:
  - type: checkboxes
    id: security-checklist
    attributes:
      label: Security & Compliance Checklist
      options:
        - label: "No hardcoded secrets (Gitleaks passed)"
        - label: "PSScriptAnalyzer Security profile passed"
        - label: "Pester tests added/updated"
        - label: "Compliance matrix updated (ISO/NIST/SBS)"
